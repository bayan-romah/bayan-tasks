<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة المهام واتفاقية مستوى الخدمة — جمعية بيان</title>
<meta name="description" content="نظام إدارة المهام ومتابعة الإنجاز والالتزام باتفاقية مستوى الخدمة — جمعية بيان">
<meta name="color-scheme" content="light dark">

<!-- تثبيت الوضع قبل الرسم، حتى لا تومض الشاشة البيضاء عند اختيار الوضع الليلي -->
<script>
  try {
    var t = localStorage.getItem("bayan_theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>

<!-- ==================== شاشة الدخول ==================== -->
<div id="login" class="login-screen" hidden></div>

<!-- ==================== التطبيق ==================== -->
<div id="app" hidden>

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <img src="assets/logo.png" alt=""
             onerror="this.replaceWith(document.createTextNode('◈'))">
      </div>
      <div>
        <b>نظام إدارة المهام</b>
        <span>جمعية بيان</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="التنقّل الرئيسي"></nav>

    <div class="side-foot">
      <div style="text-align:center;padding:0 0 8px"><span id="mode-tag" class="tag"></span></div>
      <div class="userbox" id="whoami"></div>
      <div class="side-actions">
        <button class="icon-btn" id="theme" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي"></button>
        <button class="icon-btn" id="refresh" title="تحديث البيانات">↻</button>
        <button class="icon-btn" id="logout" title="تسجيل الخروج">خروج</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="wrap" id="view"></div>
  </main>

</div>

<div id="toasts" role="status" aria-live="polite"></div>

<!-- مكتبة Supabase — تُستخدم فقط عند تعبئة المفاتيح في config.js -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
        crossorigin="anonymous"></script>

<!-- الإعدادات والبيانات -->
<script src="js/config.js"></script>
<script src="js/seed-data.js"></script>

<!-- المحرّكات -->
<script src="js/sla.js"></script>
<script src="js/workflow.js"></script>

<!-- طبقة البيانات -->
<script src="js/db-demo.js"></script>
<script src="js/db-supabase.js"></script>

<!-- الواجهة -->
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/catalog.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/app.js"></script>

</body>
</html>
